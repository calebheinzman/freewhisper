name: Release

# Note this runs the workflow file as it exists on the tagged commit. Merge to
# main before tagging, or the tag does nothing and looks silently broken.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90        # notarization alone can take 30

    # Scoped per job rather than workflow-wide: bump-cask authenticates to the
    # tap with a deploy key and has no business holding a writable token here.
    permissions:
      contents: write

    outputs:
      version: ${{ steps.v.outputs.version }}
      dmg_sha: ${{ steps.sums.outputs.dmg_sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0       # CFBundleVersion is `git rev-list --count HEAD`

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      # A tag name is attacker-controlled input. Refnames forbid spaces and
      # ~^:?*[\ but happily permit ; $ ` ( ) & | ' " — and by the next step this
      # job holds the decoded Developer ID private key. So the name is validated
      # here, and every later step reads it from the environment rather than
      # letting ${{ }} paste it into a shell script before bash sees it.
      - name: Derive version
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "refusing to build tag '$REF_NAME': expected vMAJOR.MINOR.PATCH"
              exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $REF_NAME"

      - name: Import Developer ID certificate
        env:
          CERT_B64:          ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD:     ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Without this, codesign blocks on a GUI keychain-access prompt that
          # nobody can answer and the job hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

          # Fail here, in seconds, rather than at notarization twenty minutes in.
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "no Developer ID Application identity after import"; exit 1; }

      # The key id and issuer id are repository *variables*, not secrets: both are
      # public identifiers — Apple bakes the key id into the filename it hands
      # you. Registering them as secrets only makes Actions mask them to *** in
      # notarytool's output, which is exactly what you need to read when a
      # notarization fails. The .p8 itself is the secret.
      - name: Write App Store Connect API key
        env:
          KEY_B64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ vars.AC_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
            .build/repositories
          # No restore-keys: a prefix fallback would let a cache built under a
          # different Package.resolved feed dependency *source* into the job that
          # signs the binary, and SwiftPM does not re-verify an already populated
          # checkouts/ against the pinned revision.
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - run: make build && swift test

      - name: Build, sign, notarize, staple
        env:
          AC_API_KEY_PATH:  ${{ runner.temp }}/private_keys/AuthKey_${{ vars.AC_API_KEY_ID }}.p8
          AC_API_KEY_ID:    ${{ vars.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ vars.AC_API_ISSUER_ID }}
          VERSION:          ${{ steps.v.outputs.version }}
        run: make dist VERSION="$VERSION"

      - name: Checksums
        id: sums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          echo "dmg_sha=$(shasum -a 256 "build/dist/FreeWhisper-$VERSION.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$(shasum -a 256 "build/dist/FreeWhisper-$VERSION.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION:  ${{ steps.v.outputs.version }}
          DMG_SHA:  ${{ steps.sums.outputs.dmg_sha }}
          ZIP_SHA:  ${{ steps.sums.outputs.zip_sha }}
        run: |
          set -euo pipefail
          V="$VERSION"
          cat > notes.md <<EOF
          ## Install

          Download \`FreeWhisper-$V.dmg\`, open it, and drag FreeWhisper to Applications.

          Or, with Homebrew:

          \`\`\`sh
          brew install --cask calebheinzman/tap/freewhisper
          \`\`\`

          Signed with a Developer ID certificate and notarized by Apple, so it opens
          without any right-click ritual. Requires macOS 14.4 or later on Apple Silicon.

          On first launch FreeWhisper downloads about 1.1 GB of speech models, and asks
          for Microphone and System Audio Recording permission.

          ### Checksums
          \`\`\`
          $DMG_SHA  FreeWhisper-$V.dmg
          $ZIP_SHA  FreeWhisper-$V.zip
          \`\`\`
          EOF
          gh release create "$REF_NAME" \
            --title "FreeWhisper $V" \
            --notes-file notes.md \
            "build/dist/FreeWhisper-$V.dmg" \
            "build/dist/FreeWhisper-$V.zip"

      - name: Clean up secrets on the runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys"
          # Deleted on the happy path too, but an import failure aborts before
          # that and would otherwise leave the decoded certificate behind.
          rm -f "$RUNNER_TEMP/cert.p12"

  # Just a sed and a git push, so there is no reason to burn a macOS runner minute.
  bump-cask:
    needs: release
    runs-on: ubuntu-latest
    # Authenticates to the tap with a deploy key; it never uses GITHUB_TOKEN.
    permissions: {}
    steps:
      # A deploy key rather than a personal access token: it is scoped to this
      # one repository, carries none of the account-wide reach a PAT does, and
      # does not expire out from under the release workflow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: calebheinzman/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Bump cask
        env:
          V:   ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.dmg_sha }}
        run: |
          set -euo pipefail
          sed -i -E "s/^  version \".*\"$/  version \"$V\"/"  Casks/freewhisper.rb
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" Casks/freewhisper.rb
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-releasing the same version leaves the cask unchanged, and a bare
          # commit would then fail the job *after* the release is already public.
          git diff --quiet || git commit -am "freewhisper $V"
          git push
